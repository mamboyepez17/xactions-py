[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xactions-py"
version = "1.3.0"
description = "X/Twitter automation toolkit en Python puro. Sin npm. Sin Puppeteer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
mcp = ["mcp[cli]>=1.0"]
dev = ["pytest>=8.0", "respx>=0.22", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
xactions = "cli.xactions:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "cli*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# sys.path.insert debe ir antes de los imports del paquete
"cli/xactions.py" = ["E402"]
"src/mcp_tools/server.py" = ["E402"]
