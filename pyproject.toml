[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xactions-py"
version = "1.8.0"
description = "X/Twitter automation toolkit in pure Python. No npm. No Puppeteer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
mcp = ["mcp[cli]>=1.0"]
dev = ["pytest>=8.0", "respx>=0.22", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
xactions = "xactions.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["xactions*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# reconfigure de encoding Windows + load_dotenv antes de imports del paquete
"src/xactions/cli.py" = ["E402"]
"src/xactions/mcp_server.py" = ["E402"]
