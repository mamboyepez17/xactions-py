[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xactions-py"
version = "1.9.0"
description = "X/Twitter automation toolkit in pure Python. No npm. No Puppeteer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mamboyepez17" }]
keywords = ["twitter", "x", "automation", "scraper", "graphql", "mcp", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/mamboyepez17/xactions-py"
Source = "https://github.com/mamboyepez17/xactions-py"
Issues = "https://github.com/mamboyepez17/xactions-py/issues"
Changelog = "https://github.com/mamboyepez17/xactions-py/blob/main/CHANGELOG.md"

[project.optional-dependencies]
mcp = ["mcp[cli]>=1.0"]
dev = ["pytest>=8.0", "respx>=0.22", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10", "pre-commit>=3.5", "mcp[cli]>=1.0"]

[project.scripts]
xactions = "xactions.cli:cli"
xactions-mcp = "xactions.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["xactions*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["xactions"]
branch = true

[tool.coverage.report]
# Floor, not a target: raise it as coverage improves, never lower it.
fail_under = 55
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# reconfigure de encoding Windows + load_dotenv antes de imports del paquete
"src/xactions/cli/__init__.py" = ["E402"]
"src/xactions/mcp_server.py" = ["E402"]
